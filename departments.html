<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Phòng ban - E-Learning Admin</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app-nav"></div>
  <main class="content">
    <div class="topbar">
      <h1>Phòng ban</h1>
      <button id="add-btn" class="btn btn-primary">+ Thêm phòng ban</button>
    </div>

    <table>
      <thead><tr><th>Tên phòng ban</th><th style="width:160px;">Hành động</th></tr></thead>
      <tbody id="data-body"></tbody>
    </table>
  </main>

  <div id="modal" class="modal-overlay">
    <div class="modal-box">
      <h2 id="modal-title">Thêm phòng ban</h2>
      <form id="item-form">
        <label>Tên phòng ban</label>
        <input id="name-input" type="text" required />
        <div class="modal-actions">
          <button type="button" id="cancel-btn" class="btn btn-secondary">Huỷ</button>
          <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initSimpleCrud } from './js/simpleCrud.js';
    initSimpleCrud({ tableName: 'departments', pageKey: 'departments', singularLabel: 'Phòng ban' });
  </script>
</body>
</html>
