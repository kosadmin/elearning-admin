<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Khoá học - E-Learning Admin</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-title">🎓 E-Learning Admin</div>
      <ul>
        <li><a href="index.html" data-page="index.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M9 21V12h6v9"/><path d="M5 10v11h14V10"/></svg>
          Trang chủ
        </a></li>
        <li><a href="system-config.html" data-page="system-config.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15 1.65 1.65 0 0 0 3 14H2.91a2 2 0 0 1 0-4H3a1.65 1.65 0 0 0 1.65-1H4.68A1.65 1.65 0 0 0 4.35 6.18l-.06-.06A2 2 0 1 1 7.12 3.3l.06.06A1.65 1.65 0 0 0 9 3.68 1.65 1.65 0 0 0 10 2h.09a2 2 0 0 1 4 0V2c0 .61.36 1.16.94 1.4a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 8c.24.58.79.94 1.4.94H21a2 2 0 0 1 0 4h-.09A1.65 1.65 0 0 0 19.4 15z"/></svg>
          Cấu hình hệ thống
        </a></li>
        <li><a href="students.html" data-page="students.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Quản trị người dùng
        </a></li>
        <li><a href="courses.html" data-page="courses.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Khoá học
        </a></li>
        <li><a href="quizzes.html" data-page="quizzes.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
          Kiểm tra & Bài thi
        </a></li>
      </ul>
      <button id="logout-btn" class="logout-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Đăng xuất
      </button>
    </aside>

    <div class="main-area">
      <header class="topbar-fixed">
        <h2 class="topbar-title">Khoá học</h2>
        <div class="topbar-user">
          <div class="avatar-circle" id="topbar-avatar">A</div>
          <div>
            <div class="topbar-user-name" id="topbar-user-name">—</div>
            <div class="topbar-user-role">Quản trị viên</div>
          </div>
        </div>
      </header>

      <main class="content">
        <div class="filters-row">
          <div style="flex:1;"></div>
          <button id="add-course-btn" class="btn btn-primary">+ Thêm khoá học</button>
        </div>

        <div class="table-wrap">
          <div class="table-scroll">
            <table>
              <thead><tr><th>Khoá học</th><th>Giảng viên</th><th>Cấp độ</th><th>Hiển thị</th><th>Trạng thái</th><th>Bài học</th><th>Thao tác</th></tr></thead>
              <tbody id="courses-body"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="course-modal" class="modal-overlay">
    <div class="modal-box" style="width:520px;">
      <h2 id="course-modal-title">Thêm khoá học</h2>
      <form id="course-form">
        <div class="form-grid">
          <div class="full-width">
            <label class="field-label">Tên khoá học *</label>
            <input id="c-title" class="field-input" type="text" required />
          </div>
          <div>
            <label class="field-label">Icon (emoji)</label>
            <input id="c-icon" class="field-input" type="text" maxlength="4" />
          </div>
          <div>
            <label class="field-label">Giảng viên</label>
            <input id="c-instructor" class="field-input" type="text" />
          </div>
          <div class="full-width">
            <label class="field-label">Mô tả</label>
            <textarea id="c-description" class="field-input" rows="3"></textarea>
          </div>
          <div class="full-width">
            <label class="field-label">Mục tiêu học tập (mỗi dòng 1 mục tiêu)</label>
            <textarea id="c-objectives" class="field-input" rows="3" placeholder="VD:&#10;Nắm vững quy trình bán hàng&#10;Thành thạo kỹ năng giao tiếp"></textarea>
          </div>
          <div>
            <label class="field-label">Cấp độ</label>
            <select id="c-level" class="field-input">
              <option value="">-- Không chọn --</option>
              <option value="Cơ bản">Cơ bản</option>
              <option value="Trung cấp">Trung cấp</option>
              <option value="Nâng cao">Nâng cao</option>
            </select>
          </div>
          <div>
            <label class="field-label">Phòng ban phụ trách</label>
            <select id="c-department" class="field-input" data-select="department" data-empty-label="-- Không giới hạn --"></select>
          </div>
          <div>
            <label class="field-label">Hiển thị</label>
            <select id="c-visibility" class="field-input">
              <option value="private">Riêng tư (cần đăng nhập, được gán mới thấy)</option>
              <option value="public">Công khai (khách cũng xem được)</option>
            </select>
          </div>
        </div>
        <div class="switch-row">
          <label class="switch"><input type="checkbox" id="c-status" checked /><span class="slider"></span></label>
          <span>Đang hoạt động</span>
        </div>
        <div class="modal-actions">
          <button type="button" id="course-cancel-btn" class="btn btn-secondary">Huỷ</button>
          <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAdmin } from './js/auth.js';
    import { initCoursesPage } from './js/courses.js';
    await requireAdmin();
    initCoursesPage();
  </script>
</body>
</html>
